'App\Entity\Location':
    properties:
        city:
            - NotBlank:
                  message: 'Podaj nazwę miejscowości.'
                  groups: [new, edit]
            - Length:
                  min: 2
                  max: 100
                  minMessage: 'Nazwa miejscowości musi mieć co najmniej {{ limit }} znaki.'
                  maxMessage: 'Nazwa miejscowości może mieć maksymalnie {{ limit }} znaków.'
                  groups: [new, edit]

        country:
            - NotBlank:
                  message: 'Wybierz państwo.'
                  groups: [new, edit]
            - Choice:
                  choices: ['PL', 'DE', 'FR', 'ES', 'IT', 'GB', 'US']
                  message: 'Wybierz państwo z dostępnej listy.'
                  groups: [new, edit]

        latitude:
            - NotBlank:
                  message: 'Podaj szerokość geograficzną.'
                  groups: [new, edit]
            - Range:
                  min: -90
                  max: 90
                  notInRangeMessage: 'Szerokość geograficzna musi mieścić się w zakresie od -90 do 90.'
                  groups: [new, edit]

        longitude:
            - NotBlank:
                  message: 'Podaj długość geograficzną.'
                  groups: [new, edit]
            - Range:
                  min: -180
                  max: 180
                  notInRangeMessage: 'Długość geograficzna musi mieścić się w zakresie od -180 do 180.'
                  groups: [new, edit]

'App\Entity\Measurement':
    properties:
        location:
            - NotNull:
                  message: 'Wybierz miejscowość.'
                  groups: [new, edit]

        date:
            - NotNull:
                  message: 'Podaj datę pomiaru.'
                  groups: [new, edit]

        celsius:
            - NotBlank:
                  message: 'Podaj temperaturę.'
                  groups: [new, edit]
            - Range:
                  min: -99
                  max: 99
                  notInRangeMessage: 'Temperatura musi mieścić się w zakresie od -99 do 99°C.'
                  groups: [new, edit]

